<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="ToyPair website" />
        <meta name="author" content="Mariani Francesco Paolo" />
		<link rel="canonical" href="https://kiliken.github.io/" />
        <title>ToyPair</title>
        <link rel="icon" type="image/x-icon" href="img/smolicon.png" />
        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Google fonts-->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Muli:ital,wght@0,400;0,800;1,400;1,800&family=Saira+Extra+Condensed:wght@500;700&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700;900&display=swap" rel="stylesheet">        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
		<link rel="stylesheet" href="highlight/styles/github-dark.css">
		<script src="highlight/highlight.min.js"></script>
    </head>
    <body id="page-top">
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="sideNav">
            <a class="navbar-brand js-scroll-trigger" href="#page-top">
                <span class="d-block d-lg-none"> <img class="img-fluid mx-auto mb-2" id="random-logo" width="35" src="img/mylogo.svg" alt="..." /></span>
				<span class="d-none d-lg-block"> <img class="img-fluid img-profile mx-auto mb-2"id="random-logo-big" src="img/mylogo.svg" alt="..." /> </span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#about">About</a></li>
					<li class="nav-item"><a class="nav-link js-scroll-trigger" href="#plan">Planning</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#arts">2D Design</a></li>
					<li class="nav-item"><a class="nav-link js-scroll-trigger" href="#models">3D Design</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#prog">Programming</a></li>
					
					<!-- Language Change-->
					<li class="nav-item"><p class="nav-link js-scroll-trigger" href="#more"></a></li>
					<li class="nav-item"><a class="nav-link js-scroll-trigger" id="langSwitch" href="index.html?lang=en">English</a></li>
                </ul>
            </div>
        </nav>
        <!-- Page Content-->
        <div class="container-fluid p-0">
            <!-- Title-->
            <section class="resume-section" id="about">
                <div class="resume-section-content">
                    <img src="img/TitleLogo.png" class="img-fluid">
					<p class="lead mb-5" id="aboutGame">
						
					</p>
                </div>
            </section>
			<hr class="m-0" />
            <!-- Planning -->
            <section class="resume-section" id="plan">
                <div class="resume-section-content">
                    <h2 class="mb-5" id="plan-title">プランニング (Planning)</h2>
					<div class="renderer" id="plan-contents">
						<!-- Marked.js output goes here -->
					</div>
                  </div>
            </section>
            <hr class="m-0" />
            <!-- 2D Design -->
            <section class="resume-section" id="arts">
                <div class="resume-section-content" id="exp">
                    <h2 class="mb-5" id="2d-title">2Dデザイン (2D Design)</h2>
					<div class="renderer" id="des2D-contents">
						<!-- Marked.js output goes here -->
					</div>
                </div>
            </section>
            <hr class="m-0" />
			<!-- 3D Design -->
            <section class="resume-section" id="models">
                <div class="resume-section-content" id="cert">
                    <h2 class="mb-5" id="3d-title">3Dデザイン (3D Design)</h2>
					<div class="renderer" id="des3D-contents">
						<!-- Marked.js output goes here -->
						<!-- Ref https://modelviewer.dev/ for model display -->
					
					</div>
                </div>
            </section>
            <hr class="m-0" />
            <!-- Programming -->
            <section class="resume-section" id="prog">
                <div class="resume-section-content" id="edu">
                    <h2 class="mb-5" id="pro-title">プログラミング (Programming)</h2>
                    <div class="renderer" id="pro-contents">
						<!-- Marked.js output goes here -->
					</div>
                </div>
            </section>
            <hr class="m-0" />
            
        </div>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
		<!-- Core theme JS-->
		<script src="./js/marked.min.js"></script>
        <script src="js/scripts.js"></script>
        <script type="module" src="js/dataScript.js"></script>
		<script type="module">
			import { Localize } from "./js/dataScript.js";
			import { getUrlParameter } from "./js/dataScript.js";
			import { loadMarkdown } from "./js/dataScript.js";
			
			var planContent = "./data/en_plan.md";
			var des2dContent = "./data/en_des2d.md";
			var des3dContent = "./data/en_des3d.md";
			var proContent = "./data/en_pro.md";
			
			document.addEventListener('DOMContentLoaded', async () => {
				
				const titleIcon = document.getElementById("random-logo");
				const titleIconBig = document.getElementById("random-logo-big");
				
				const randomNum = Math.floor(Math.random() * 9) + 1;
				
				titleIcon.src = `./img/SubChara_${randomNum}.png`;
				titleIconBig.src =`./img/SubChara_${randomNum}.png`;
				
				const lang = getUrlParameter("lang") ?? "jp";
				Localize(lang);
				planContent = `./data/${lang}_plan.md`;
				des2dContent = `./data/${lang}_des2d.md`;
				des3dContent = `./data/${lang}_des3d.md`;
				proContent = `./data/${lang}_pro.md`;
				
				if(lang === "en") {
					
					const langButton = document.getElementById("langSwitch");
					langButton.href="index.html?lang=jp";
					langButton.textContent="日本語";
				}
				
				await Promise.all([
					loadMarkdown( planContent, "plan-contents"),
					loadMarkdown( des2dContent, "des2D-contents"),
					loadMarkdown( des3dContent, "des3D-contents"),
					loadMarkdown( proContent, "pro-contents")
				]);
			
				hljs.highlightAll();
				
			});
		</script>
    </body>
</html>
