<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="My personal website" />
  <meta name="author" content="Mariani Francesco Paolo" />
  <title>ToyPair - Models</title>
  <link rel="icon" type="image/x-icon" href="img/smolicon.png" />
  <!-- Font Awesome icons (free version)-->
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <!-- Google fonts-->
  <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700" rel="stylesheet" type="text/css" />
  <link href="https://fonts.googleapis.com/css?family=Muli:400,400i,800,800i" rel="stylesheet" type="text/css" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  <!-- Core theme CSS (includes Bootstrap)-->
  <link rel="stylesheet" href="css/styles.css">
  <script type="module">
	import { getUrlParameter } from "./js/dataScript.js";
	
	const name = getUrlParameter("model") ?? "toyTest";
	
	const model = document.getElementById("theModel");
	
	model.src = `data/models/${name}.glb`;
	
  </script>
</head>
<body class="Content3d">
  <!-- README -->
  <model-viewer id="theModel" alt="ToyPair Model" src="data/models/toyTest.glb" ar animation-name="WaveAnimation" autoplay shadow-intensity="1" camera-controls touch-action="pan-y"></model-viewer>
  <!-- Bootstrap core JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Core theme JS-->
  <script src="./js/marked.min.js"></script>
</body>

</html>
